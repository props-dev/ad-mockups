<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Defense-in-depth: params are attacker-influenced once preview links are shared.
     Text is HTML-escaped in JS; this CSP additionally blocks any external script/
     object/fetch even if an escaping bug slipped through. script-src must stay
     'unsafe-inline' because the whole app is the inline script below. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src https: data:; media-src https:; base-uri 'none'; form-action 'none'">
<meta name="ad-mockup-version" content="1.1.0">
<title>Ad Preview</title>
<style>
  /* ============ base ============ */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: transparent;
    -webkit-font-smoothing: antialiased;
    display: flex; align-items: flex-start; justify-content: center;
  }
  body.theme-dark { background: #000; }
  img, video { display: block; max-width: 100%; }
  button { font: inherit; border: 0; background: none; cursor: pointer; }
  svg { display: block; }
  #root { width: 100%; display: flex; justify-content: center; }

  /* ============ shared: avatar / placeholder / see-more ============ */
  .avatar { border-radius: 50%; overflow: hidden; position: relative; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
  .see-more { color: #65676b; cursor: pointer; font-weight: 500; }
  .theme-dark .see-more, .tt .see-more { color: rgba(255,255,255,.75); }

  .ph { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 8px;
    align-items: center; justify-content: center;
    background: linear-gradient(160deg, #e9ebee 0%, #d8dbe0 100%); color: #9aa0a8; }
  .ph.dark { background: linear-gradient(160deg, #2b2b31 0%, #141417 100%); color: #55555e; }
  .ph .ph-label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; }

  /* media shells: placeholder sits behind, real media covers it */
  .media-shell { position: relative; overflow: hidden; background: #000; width: 100%; }
  .media-shell > img.media-el, .media-shell > video.media-el {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .media-shell.contain > video.media-el { object-fit: contain; }

  /* ============ shared: video controls ============ */
  .mute-btn { position: absolute; right: 10px; bottom: 10px; width: 30px; height: 30px;
    border-radius: 50%; background: rgba(0,0,0,.55); display: flex; align-items: center;
    justify-content: center; z-index: 3; }
  .mute-btn svg { width: 15px; height: 15px; fill: #fff; }
  .play-overlay { position: absolute; inset: 0; display: none; align-items: center;
    justify-content: center; z-index: 2; background: rgba(0,0,0,.15); }
  .play-overlay.visible { display: flex; }
  .play-overlay .play-btn { width: 56px; height: 56px; border-radius: 50%;
    background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; }
  .play-overlay svg { width: 22px; height: 22px; fill: #fff; margin-left: 3px; }

  /* ============ shared: carousel ============ */
  .carousel { position: relative; width: 100%; }
  .car-track { display: flex; overflow-x: auto; scroll-snap-type: x mandatory;
    scrollbar-width: none; -ms-overflow-style: none; }
  .car-track::-webkit-scrollbar { display: none; }
  .car-item { flex: 0 0 100%; scroll-snap-align: start; position: relative; overflow: hidden; }
  .car-item img.media-el { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .car-counter { position: absolute; top: 10px; right: 10px; z-index: 3; background: rgba(0,0,0,.55);
    color: #fff; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 12px; }
  .car-dots { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; gap: 5px;
    justify-content: center; z-index: 3; }
  .car-dots .dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.5);
    transition: background .2s, transform .2s; }
  .car-dots .dot.active { background: #fff; transform: scale(1.15); }
  .car-arrow { position: absolute; top: 50%; transform: translateY(-50%); z-index: 3;
    width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,.9);
    box-shadow: 0 1px 4px rgba(0,0,0,.3); display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity .15s; }
  .car-arrow svg { width: 14px; height: 14px; fill: #444; }
  .car-arrow.prev { left: 8px; }
  .car-arrow.next { right: 8px; }
  .carousel:hover .car-arrow { opacity: 1; }
  @media (hover: none) { .car-arrow { display: none; } }

  /* broken media → reveal placeholder behind */
  .media-el.broken { display: none !important; }

  /* ============================================================

     ============================================================ */

  .fb-header { display: flex; align-items: center; gap: 8px; padding: 12px 12px 0 12px; }

  .fb-id { flex: 1; min-width: 0; }
  .fb-name { font-size: 15px; font-weight: 600; line-height: 1.25;
    display: flex; align-items: center; gap: 4px; }
  .fb-sub { font-size: 13px; color: #65676b; display: flex; align-items: center; gap: 4px; }
  .fb-sub svg { width: 12px; height: 12px; fill: #65676b; }
  .fb-hdr-icons { display: flex; gap: 14px; color: #65676b; }
  .fb-hdr-icons svg { width: 18px; height: 18px; fill: #65676b; }

  .fb-domain { font-size: 13px; color: #65676b; text-transform: uppercase; letter-spacing: .01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fb-headline { font-size: 15px; font-weight: 600; line-height: 1.25; margin-top: 1px;

  .fb-rxn.like { background: #1877f2; z-index: 2; }

  .fb-actions { display: flex; border-top: 1px solid #e4e6eb; margin: 0 12px; }

  .fb .verified svg { width: 13px; height: 13px; fill: #1877f2; }

     ============================================================ */
  .fbs { position: relative; width: 100%; max-width: 420px; height: 100dvh; max-height: 100vh;
    background: #000; color: #fff; overflow: hidden; }
  .fbs .media-shell { position: absolute; inset: 0; height: 100%; }
  .fbs .carousel, .fbs .car-track, .fbs .car-item { height: 100%; }
  /* single-card progress bar and carousel dots share styling: in a story the

  .fbs-progress, .fbs .car-dots { position: absolute; top: 10px; left: 10px; right: 10px;
    bottom: auto; display: flex; gap: 4px; justify-content: stretch; z-index: 5; }
  .fbs-progress .seg, .fbs .car-dots .dot { flex: 1; width: auto; height: 3px; border-radius: 2px;

  .fbs-header { position: absolute; top: 22px; left: 0; right: 0; z-index: 5;

  .fbs-name .verified svg { width: 13px; height: 13px; fill: #fff; }
  .fbs-sub { font-size: 12px; color: rgba(255,255,255,.85); text-shadow: 0 1px 2px rgba(0,0,0,.4); }
  .fbs-hdr-icons { display: flex; gap: 18px; }
  .fbs-hdr-icons svg { width: 20px; height: 20px; fill: #fff;

  .fbs-bottom { position: absolute; left: 0; right: 0; bottom: 0; z-index: 5;

  .fbs-chevron svg { width: 20px; height: 20px; fill: #fff;

  .fbs-cta { background: #fff; color: #050505; font-size: 15px; font-weight: 600;

    display: flex; align-items: center; justify-content: center; }
  .tt-follow svg { width: 9px; height: 9px; fill: #fff; }
  .tt-rail-item { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .tt-rail-item svg { width: 30px; height: 30px; fill: #fff;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,.4)); }
  .tt-rail-count { font-size: 12px; font-weight: 600; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
  .tt-disc { width: 38px; height: 38px; border-radius: 50%; margin-top: 2px;

    display: flex; align-items: center; justify-content: center;
    animation: tt-spin 6s linear infinite; }
  .tt-disc .avatar { width: 20px; height: 20px; font-size: 8px; }
  @keyframes tt-spin { to { transform: rotate(360deg); } }
  /* bottom-left stack */
  .tt-bottom { position: absolute; left: 0; right: 64px; bottom: 0; z-index: 4;
    padding: 0 14px 14px; background: linear-gradient(transparent, rgba(0,0,0,.45)); }
  .tt-handle { font-size: 17px; font-weight: 700; text-shadow: 0 1px 2px rgba(0,0,0,.5);

  .tt-caption { font-size: 15px; line-height: 1.35; margin-top: 5px;

  .tt-sponsored { display: inline-flex; align-items: center; gap: 4px; margin-top: 7px;

  .tt-music { display: flex; align-items: center; gap: 6px; margin-top: 7px; font-size: 14px;

  .tt-music svg { width: 13px; height: 13px; fill: #fff; flex-shrink: 0; }
  .tt-music span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tt-cta { display: flex; align-items: center; justify-content: space-between; margin-top: 12px;

  .tt-cta.hot { background: #fe2c55; }
  .tt-cta svg { width: 14px; height: 14px; fill: #fff; }
  .tt .car-dots { bottom: auto; top: 46px; }

  .yt-headline { font-size: 15px; font-weight: 500; line-height: 1.35;

  .yt-sub { font-size: 13px; color: #606060; margin-top: 3px;

      video.addEventListener("click", function () {
        if (video.paused) tryPlay();
        else { video.pause(); showOverlay(true); }
      });
      muteBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        video.muted = !video.muted;
        muteBtn.innerHTML = video.muted ? I.soundOff : I.soundOn;
      });
    });
  }
  function wireTikTok(root) {
    var cta = root.querySelector(".js-tt-cta");
    if (cta) setTimeout(function () { cta.classList.add("hot"); }, 1500);
  }

  /* ---------------- render + integrations ---------------- */
  var root = document.getElementById("root");
  var params;

  function render() {
    params = computeParams();
    document.body.classList.toggle("theme-dark", params.platform === "tiktok" ||
      (params.platform === "facebook" && params.placement === "story"));
    root.innerHTML = RENDERERS[params.platform](params);
    wireSeeMore(root);
    wireCarousels(root);
    wireVideos(root, params);
    wireTikTok(root);
    console.info("[ad-mockup] v" + VERSION + " platform=" + params.platform +
      " placement=" + params.placement + " format=" + params.format);
  }
  render();

  /* report height to parent (hosted-iframe embeds can auto-size) */
  function postHeight() {
    try {
      parent.postMessage({ type: "ad-mockup:height", height: document.body.scrollHeight,
        version: VERSION }, "*");
    } catch (e) { /* no parent */ }
  }
  if ("ResizeObserver" in window) new ResizeObserver(postHeight).observe(document.body);
  postHeight();

  /* accept live param updates without a reload (avoids Bubble re-render flicker) */
  window.addEventListener("message", function (ev) {
    var d = ev.data;
    if (!d || d.type !== "ad-mockup:params" || typeof d.params !== "object") return;
    window.AD_MOCKUP_PARAMS = Object.assign({}, window.AD_MOCKUP_PARAMS, d.params);
    render();
  });
})();
</script>
