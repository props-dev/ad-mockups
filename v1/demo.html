<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ad Mockup — Demo Matrix</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f0f2f5; padding: 24px; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  p.note { color: #666; font-size: 13px; margin-bottom: 20px; }
  .grid { display: flex; flex-wrap: wrap; gap: 24px; }
  .cell { background: #fff; border-radius: 10px; padding: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .cell h2 { font-size: 13px; font-weight: 600; color: #333; margin-bottom: 8px; }
  .cell code { font-size: 10px; color: #888; display: block; max-width: 375px;
    word-break: break-all; margin-bottom: 8px; max-height: 42px; overflow: hidden; }
  iframe { border: 1px solid #ddd; border-radius: 8px; background: #fff; display: block; }
</style>
</head>
<body>
<h1>Ad Mockup — Demo Matrix</h1>
<p class="note">Every platform &times; format plus edge cases. Sample media loads from
picsum.photos / MDN sample video (demo page only — ad-mockup.html itself makes no external
requests). Each cell shows the exact URL that produces it.</p>
<div class="grid" id="grid"></div>

<script>
(function () {
  var IMG = function (seed, w, h) {
    return "https://picsum.photos/seed/" + seed + "/" + (w || 800) + "/" + (h || 800);
  };
  var VIDEO = "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4";
  var LONG_COPY = "Okay so I have to be honest about this one because I get asked constantly. " +
    "I've tested probably a dozen of these over the past year and most of them are exactly what " +
    "you'd expect: fine, forgettable, not worth the money. This one is different and I want to " +
    "explain exactly why, because the details actually matter here more than the hype does.";

  var CREATOR = { creator: "Jess Rivera", handle: "jess.reviews", avatar: IMG("avatar", 200, 200), verified: "1" };
  var COPYSET = {
    copy: "I tried this for 30 days so you don't have to — honest results inside 👇",
    headline: "The 30-day results speak for themselves",
    description: "Free shipping on your first order",
    cta: "Shop Now", domain: "shop.example.com", business: "Acme Skin Co."
  };

  function qs(obj) {
    var parts = [];
    Object.keys(obj).forEach(function (k) {
      [].concat(obj[k]).forEach(function (v) {
        parts.push(encodeURIComponent(k) + "=" + encodeURIComponent(v));
      });
    });
    return parts.join("&");
  }
  function merge() {
    var out = {};
    [].slice.call(arguments).forEach(function (o) {
      Object.keys(o).forEach(function (k) { out[k] = o[k]; });
    });
    return out;
  }

  var SIZES = { facebook: [375, 660], tiktok: [375, 667], google: [375, 440], youtube: [375, 420],
    pinterest: [375, 700] };
  var cases = [];

  /* full matrix: 5 platforms x 3 formats */
  ["facebook", "tiktok", "google", "youtube", "pinterest"].forEach(function (platform) {
    cases.push({
      label: platform + " / image",
      p: merge(CREATOR, COPYSET, { platform: platform, format: "image", media: IMG(platform + "img") })
    });
    cases.push({
      label: platform + " / video",
      p: merge(CREATOR, COPYSET, { platform: platform, format: "video", media: VIDEO,
        poster: IMG(platform + "poster") })
    });
    cases.push({
      label: platform + " / carousel",
      p: merge(CREATOR, COPYSET, { platform: platform, format: "carousel",
        media: [IMG(platform + "c1"), IMG(platform + "c2"), IMG(platform + "c3"), IMG(platform + "c4")] })
    });
  });

  /* edge cases */
  cases.push({ label: "facebook / no media, no avatar (placeholders)",
    p: { platform: "facebook", creator: "Sam Okafor", copy: "Placeholder mode — no media params passed." } });
  cases.push({ label: "facebook / long copy (See more @125ch)",
    p: merge(CREATOR, COPYSET, { platform: "facebook", format: "image",
      media: IMG("longcopy"), copy: LONG_COPY }) });
  cases.push({ label: "tiktok / long caption (See more @70ch)",
    p: merge(CREATOR, COPYSET, { platform: "tiktok", format: "image",
      media: IMG("ttlong", 720, 1280), copy: LONG_COPY }) });
  cases.push({ label: "google / protocol-relative URL (//picsum...)",
    p: merge(CREATOR, COPYSET, { platform: "google", format: "image",
      media: "//picsum.photos/seed/protorel/800/420" }) });
  cases.push({ label: "youtube / pipe-separated carousel in ONE media param",
    p: merge(CREATOR, COPYSET, { platform: "youtube", format: "carousel",
      media: IMG("p1", 800, 450) + "|" + IMG("p2", 800, 450) + "|" + IMG("p3", 800, 450) }) });
  cases.push({ label: "facebook / broken media URL (placeholder fallback)",
    p: merge(CREATOR, COPYSET, { platform: "facebook", format: "image",
      media: "https://example.invalid/nope.jpg", avatar: "https://example.invalid/nope.png" }) });
  cases.push({ label: "defaults only (?platform=tiktok, nothing else)",
    p: { platform: "tiktok" } });

  var grid = document.getElementById("grid");
  cases.forEach(function (c) {
    var size = SIZES[c.p.platform] || [375, 640];
    var url = "ad-mockup.html?" + qs(c.p);
    var cell = document.createElement("div");
    cell.className = "cell";
    cell.innerHTML = "<h2>" + c.label + "</h2><code>" + url + "</code>" +
      '<iframe src="' + url + '" width="' + size[0] + '" height="' + size[1] + '" loading="lazy"></iframe>';
    grid.appendChild(cell);
  });
})();
</script>
</body>
</html>
